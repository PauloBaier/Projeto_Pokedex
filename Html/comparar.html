<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokedex</title>
  <!-- Estilos principais da página -->
  <link rel="stylesheet" href="../Css/estilo.css">
  <link rel="stylesheet" href="../Css/cores-pokemom.css">
  <link rel="stylesheet" href="../Css/comparar.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Barra de Navegação-Header -->

  <header>
    <div class="container-navegacao">
      <div class="item-navegacao-esquerda">
        <h1>POKEDEX</h1>
      </div>
      <div class="item-navegacao-centro">
        <a id="btn-pesquisar" href="procura.html"><img src="../assets/pesquisa-icon.png">Pesquisar</a>
        <a href="index.html"><img src="../assets/home.png">Inicio</a>
        <a href="favoritos.html"><img src="../assets/Pokeball.png">Favoritos</a>
        <a href="pokemons.html"><img src="../assets/pikachu-icon.png">Pokémons</a>
      </div>
      <div class="item-navegacao-direita">
        <input type="text" id="barra-pesquisa" placeholder="Buscar">
        <div class="btn-menu-nav">
          <div></div>
          <div class="menu-direita"></div>
          <div class="menu-esquerda"></div>
          <div></div>
        </div>
      </div>
    </div>
  </header>

  <section class="secao-comparacao">
    <div class="escolha-pokemom">
      <h2>Comparar Pokémoms:</h2>
      <div>
        <div>
          <h3>Pokemom 1:</h3>
          <input type="text" id="pokemom-1" placeholder="Pokemom">
          <button id="btn-pokemom-1">Buscar</button>
        </div>
        <div>
          <h3>Pokemom 2:</h3>
          <input type="text" id="pokemom-2" placeholder="Pokemom">
          <button id="btn-pokemom-2">Buscar</button>
        </div>
      </div>
    </div>

    <div class="comparar-info">
      <div class="pokedex-ui left normal">
        <div class="img-moldura moldura-pokedex-ui">
          <img src="">
          <div class="tipo-pokemom">
            <span></span>
          </div>
        </div>
        <h4></h4>
        <div class="stats">
          <span>HP:</span><span class="hp"></span><br>
          <span>Atack:</span><span class="attack"></span>
        </div>
      </div>

      <div class="visualizacao-comparacao-container">
        <div class="visualizacao-comparacao">
          <div class="linhas-comparacao">
            <h3 id="nome1">Bulbasaur</h3>
            <h3 id="nome2">Charmander</h3>
          </div>
          <div class="linhas-comparacao">
            <span>Weight: <span id="peso1"></span>KG</span>
            <span class="indicador-peso"></span>
            <span>Weight: <span id="peso2"></span>KG</span>
          </div>
          <div class="linhas-comparacao">
            <span>Height: <span id="altura1"></span>M</span>
            <span class="indicador-altura"></span>
            <span>Height: <span id="altura2"></span>M</span>
          </div>
          <div class="linhas-comparacao">
            <span>HP: <span id="hp1"></span></span>
            <span class="indicador-hp"></span>
            <span>HP: <span id="hp2"></span></span>
          </div>
          <div class="linhas-comparacao">
            <span>Atack: <span id="attack1"></span></span>
            <span class="indicador-attack"></span>
            <span>Atack: <span id="attack2"></span></span>
          </div>
          <div class="linhas-comparacao">
            <span>Type: <span id="tipo1"></span></span>
            <span>Type: <span id="tipo2"></span></span>
          </div>
        </div>
      </div>

      <div class="pokedex-ui right normal">
        <div class="img-moldura moldura-pokedex-ui">
          <img src="">
          <div class="tipo-pokemom">
            <span></span>
          </div>
        </div>
        <h4></h4>
        <div class="stats">
          <span>HP:</span><span class="hp"></span><br>
          <span>Atack:</span><span class="attack"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- Rodapé da Página -->
  <footer>
    <div>
      <h1>POKEDEX</h1>
    </div>
  </footer>
</body>
<script type="module" src="../JavaScript/comparar.js"></script>
<script src="../JavaScript/pesquisa.js"></script>
<script>
  document.getElementsByClassName('btn-menu-nav')[0].addEventListener('click', function () {
    document.getElementsByClassName('btn-menu-nav')[0].classList.toggle('show')
    document.getElementsByClassName('item-navegacao-centro')[0].classList.toggle('mostrar')
  })
</script>

</html>
